[workspace]
resolver = "2"
members = [
    "crates/kzray-data",
    "crates/kzray-exec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rayon = "1.10"
rand_pcg = "0.3"
thiserror = "1"