[workspace]
resolver = "2"
members = [
    "crates/kzray-math",
    "crates/kzray-data",
    "crates/kzray-abs",
    "crates/kzray-impl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
rayon = "1.10"
rand = "0.10"          
rand_pcg = "0.10"
rand_core = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "pnm"] }
thiserror = "1"
